<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <title>%OG_TITLE%</title>
    <meta name="description" content="%OG_DESCRIPTION%" />

    <!-- WhatsApp / Social Preview (Werte kommen aus src/data/wedding.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_TITLE%" />
    <meta property="og:url" content="%OG_URL%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Pinyon+Script&display=swap"
    />
    <link rel="preload" as="image" href="/assets/textures/paper-grain.webp" type="image/webp" />
    <style>
      /* sofortiger Papierhintergrund, bevor JS lädt */
      html, body { background: #F7F1E6; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Georgia, serif; text-align: center; padding: 40px 20px; color: #3A2F22">
        Melek &amp; Alessio — 10 July 2027 — Capri, Italia.<br />Please enable JavaScript to open the invitation.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
